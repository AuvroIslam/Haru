[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "haru"
version = "0.0.1"
description = "Your facts and documents, carried onto any form on the web."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "cryptography>=42",
    "playwright>=1.40",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.scripts]
haru = "haru.cli:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "httpx",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: needs a running Ollama; slow, skipped by default",
]
addopts = "-m 'not live'"
pythonpath = ["src"]
